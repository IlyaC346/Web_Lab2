<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Контакты</h1>

    <table>
      <tr><th>Организация</th><td>ООО «КвизПро»</td></tr>
      <tr><th>Адрес</th><td>г. Москва, ул. Учебная, д. 12, офис 305</td></tr>
      <tr><th>Телефон</th><td>+7 (495) 123-45-67</td></tr>
      <tr><th>E-mail</th><td>info@quizpro.example</td></tr>
      <tr><th>Режим работы</th><td>Пн–Пт, 9:00–18:00 <span id="openStatus"></span></td></tr>
    </table>

    <h2>Обратная связь</h2>
    <form id="fbForm" novalidate>
      <label for="fbName">Имя</label>
      <input id="fbName">
      <label for="fbEmail">E-mail</label>
      <input id="fbEmail" type="email">
      <label for="fbMsg">Сообщение</label>
      <textarea id="fbMsg" maxlength="500"></textarea>
      <div><button type="submit">Отправить</button></div>
      <div class="message" id="fbResult"></div>
    </form>
  </main>

  <script src="js/common.js"></script>
  <script src="js/contacts.js"></script>
</body>
</html>
